# Três serviços da atividade: Keycloak (IdP), servidor de prontuários e portal do médico.
# O serviço "bootstrap" é só uma ferramenta: gera chaves e configuração antes da subida.
services:
  # Etapa 1: Keycloak em contêiner; o realm Telemedicina-Realm é importado de ./infra.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak_med
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
    volumes:
      - ./infra:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data

  bootstrap:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
    image: telemedicina-app:local
    command: ["python", "-m", "scripts.bootstrap"]
    volumes:
      - ./runtime:/app/runtime
      - ./infra:/app/infra

  # Servidor de Prontuários (Resource Server): POST /api/prontuarios. Só tem a chave do servidor.
  resource-server:
    init: true
    image: telemedicina-app:local
    container_name: prontuarios_api
    command: ["python", "-m", "telemedicina.server"]
    environment:
      BIND_HOST: 0.0.0.0
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./runtime/config.json:/app/runtime/config.json:ro
      - ./runtime/server-private.jwk:/app/runtime/server-private.jwk:ro
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12

  # Portal do Médico (Aplicação Cliente): login OIDC e envio do Nested JWT. Só tem a chave do médico.
  client-app:
    init: true
    image: telemedicina-app:local
    container_name: portal_medico
    command: ["python", "-m", "telemedicina.portal"]
    environment:
      BIND_HOST: 0.0.0.0
      KEYCLOAK_URL: http://keycloak:8080
      RESOURCE_SERVER_URL: http://resource-server:5001
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./runtime/config.json:/app/runtime/config.json:ro
      - ./runtime/doctor-private.jwk:/app/runtime/doctor-private.jwk:ro
    depends_on:
      resource-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  keycloak-data:
