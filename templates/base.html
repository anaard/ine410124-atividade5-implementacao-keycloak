<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal do Médico{% endblock %} · Telemedicina</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <header class="site-header"><div class="header-inner">
    <a class="site-name" href="/">Telemedicina <span>Portal do Médico</span></a>
    {% if user %}
    <div class="session"><span>Médico: <strong>{{ user.name }}</strong></span>
      <form method="post" action="/logout"><button class="text-button" type="submit">Sair do portal</button></form>
    </div>
    {% endif %}
  </div></header>
  <main id="conteudo" class="page">{% block content %}{% endblock %}</main>
  <footer class="site-footer">INE410124 · Tópicos Especiais em Computação: Segurança - Web, Identidades e Nuvem · Atividade 5</footer>
</body>
</html>
